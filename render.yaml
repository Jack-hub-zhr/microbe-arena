# Render Blueprint —— 微生物进化大赛 · Petri Arena
#
# 静态站点（Static Site）走 Render 的 CDN 边缘分发：
#   · 免费版包含 5 GB/月 出站带宽 + 500 分钟/月 构建时长，免信用卡
#   · 无冷启动（不是会休眠的 Web Service）
#   · 每次 push 到 main 自动重新构建并发布
#
# 一键部署：https://dashboard.render.com/blueprint/new?repo=https://github.com/Jack-hub-zhr/microbe-arena
#
services:
  - type: web
    name: microbe-arena
    repo: https://github.com/Jack-hub-zhr/microbe-arena
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    branch: main
    region: singapore # 离中文用户最近
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
