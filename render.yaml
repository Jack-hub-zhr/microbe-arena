# Render Blueprint —— 微生物进化大赛 · Petri Arena
#
# ── 一键部署（点开 → 授权 Render 读取这一个仓库 → Apply）──────────────
#   https://dashboard.render.com/blueprint/new?repo=https://github.com/Jack-hub-zhr/microbe-arena
#
# Render 会直接读这份文件建站，不需要在表单里手填任何字段：
#   · 免费版 Static Site：CDN 边缘分发，5 GB/月出站带宽 + 500 分钟/月构建时长，免信用卡
#   · 静态站点不会像免费 Web Service 那样休眠，没有冷启动
#   · 每次 push 到 main 自动重新构建并发布
#   · 预发布：每个 PR 得到独立预览地址
#
services:
  - type: web
    name: microbe-arena
    repo: https://github.com/Jack-hub-zhr/microbe-arena
    runtime: static

    # 构建：装依赖 → Vite 产出 dist/
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    branch: main

    # 区域：离中文用户最近
    region: singapore

    # 推送即发布
    autoDeploy: true
    pullRequestPreviewsEnabled: true

    # 响应头：静态资源长缓存 + 基本安全头
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
